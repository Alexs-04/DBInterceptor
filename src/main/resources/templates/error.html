<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DB Inspector - Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-database"></i> DB Inspector</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <i class="bi bi-exclamation-octagon"></i> Se produjo un error
            <span class="badge bg-light text-dark ms-2" th:if="${status}" th:text="${status}"></span>
        </div>
        <div class="card-body">
            <p class="mb-2 text-break"
               th:text="${#strings.isEmpty(message) ? (error ?: 'Ha ocurrido un error inesperado.') : message}">
                Ha ocurrido un error inesperado.
            </p>
            <p class="small text-muted mb-0" th:if="${path}">
                Ruta: <code th:text="${path}"></code>
            </p>
        </div>
    </div>

    <div class="mt-4">
        <a href="javascript:history.back()" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
        <a href="/" class="btn btn-outline-secondary ms-2">
            <i class="bi bi-house"></i> Inicio
        </a>
    </div>
</div>
</body>
</html>
