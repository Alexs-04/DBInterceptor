<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DB Inspector - Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-database"></i> DB Inspector</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <i class="bi bi-info-circle"></i> Información de la Base de Datos
        </div>
        <div class="card-body">
            <p><strong>Producto:</strong> <span th:text="${dbInfo.databaseProductName}"></span></p>
            <p><strong>Versión:</strong> <span th:text="${dbInfo.databaseProductVersion}"></span></p>
            <p class="text-break"><strong>URL:</strong> <span th:text="${dbInfo.url}"></span></p>
            <p class="mb-0"><strong>Usuario:</strong> <span th:text="${dbInfo.userName}"></span></p>
        </div>
    </div>

    <div class="row mt-4">
        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-header bg-primary text-white">
                    <i class="bi bi-diagram-3"></i> Explorar Esquemas
                </div>
                <div class="card-body d-flex flex-column">
                    <form action="/schema" method="get" class="mb-3">
                        <div class="mb-3">
                            <label for="exploreOwner" class="form-label">Esquema específico:</label>
                            <input type="text" class="form-control" id="exploreOwner" name="owner"
                                   placeholder="Nombre del esquema" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-search"></i> Explorar
                        </button>
                    </form>
                    <a href="/schemas" class="btn btn-outline-primary w-100 mt-auto">
                        <i class="bi bi-list-ul"></i> Ver todos los esquemas
                    </a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-header bg-warning text-dark">
                    <i class="bi bi-arrow-left-right"></i> Comparar Esquemas
                </div>
                <div class="card-body d-flex flex-column">
                    <p class="text-muted">Detecta tablas, columnas e índices que difieren entre dos esquemas.</p>
                    <a href="/compare" class="btn btn-warning w-100 mt-auto">Ir a Comparación</a>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card h-100">
                <div class="card-header bg-info text-white">
                    <i class="bi bi-arrow-right-circle"></i> Análisis de Migración
                </div>
                <div class="card-body">
                    <form action="/migration" method="get">
                        <div class="mb-3">
                            <label for="migrationOwner" class="form-label">Esquema Oracle:</label>
                            <input type="text" class="form-control" id="migrationOwner" name="owner"
                                   placeholder="Nombre del esquema" required>
                        </div>
                        <button type="submit" class="btn btn-info text-white w-100">Analizar Migración a PostgreSQL</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
