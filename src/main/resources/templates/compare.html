<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comparar Esquemas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/"><i class="bi bi-database"></i> DB Inspector</a>
        <span class="navbar-text text-light"><i class="bi bi-arrow-left-right"></i> Comparar Esquemas</span>
    </div>
</nav>
<div class="container mt-4">
    <h1>Comparar Esquemas</h1>
    <form action="/compare" method="post" class="mt-4">
        <div class="row">
            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header">
                        Esquema 1
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="schema1" class="form-label">Nombre del Esquema:</label>
                            <input type="text" class="form-control" id="schema1" name="schema1" required>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card h-100">
                    <div class="card-header">
                        Esquema 2
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="schema2" class="form-label">Nombre del Esquema:</label>
                            <input type="text" class="form-control" id="schema2" name="schema2" required>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">
            <i class="bi bi-arrow-left-right"></i> Comparar
        </button>
        <a href="/" class="btn btn-outline-secondary mt-3 ms-2">
            <i class="bi bi-house"></i> Inicio
        </a>
    </form>
</div>
</body>
</html>
