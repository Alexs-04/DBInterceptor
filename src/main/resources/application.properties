spring.application.name=dbInterceptor

# Conexion a la base de datos (obligatorias: la app no arranca si faltan)
#   DB_URL      p. ej. jdbc:oracle:thin:@//localhost:1521/ORCLPDB1
#   DB_USERNAME
#   DB_PASSWORD
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# JdbcTemplate: el driver de Oracle trae 10 filas por viaje por defecto, demasiado
# poco para las consultas al catalogo en esquemas grandes.
spring.jdbc.template.fetch-size=${DB_FETCH_SIZE:1000}
spring.jdbc.template.query-timeout=${DB_QUERY_TIMEOUT:120s}

# Thymeleaf (desactivar cache solo en desarrollo)
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
